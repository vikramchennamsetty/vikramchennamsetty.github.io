name: Amazon Browser Research Worker

on:
  workflow_dispatch:
    inputs:
      asin:
        description: 'Target Amazon ASIN (e.g., B0DK87HKY6)'
        required: true
        type: string
      marketplace:
        description: 'Target Marketplace (AMAZON_US or AMAZON_IN)'
        required: false
        default: 'AMAZON_US'
        type: string

jobs:
  research-worker:
    name: Execute Browser Use Research Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Worker Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright browser-use
          npx playwright install --with-deps chromium

      - name: Run Ephemeral Amazon Research Worker
        run: |
          python .agents/skills/elevate-research-source-orchestration/workers/amazon_browser_worker.py \
            --asin "${{ inputs.asin }}" \
            --marketplace "${{ inputs.marketplace }}" \
            --output "evidence/evidence-${{ inputs.asin }}.json"

      - name: Upload Research Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amazon-evidence-${{ inputs.asin }}
          path: evidence/evidence-${{ inputs.asin }}.json
          retention-days: 7
